<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#00052a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Page Not Found | W. Apparels Ltd.</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #00052a; color: #fff; }
      main { width: min(620px, 100%); padding: 48px 28px; border: 1px solid rgba(255,255,255,.16); border-radius: 18px; background: rgba(255,255,255,.07); text-align: center; }
      img { width: 88px; height: 88px; border-radius: 18px; }
      p:first-of-type { margin: 24px 0 0; font-size: 14px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(32px, 6vw, 52px); }
      .copy { margin: 0 auto; max-width: 460px; color: #d7d9e4; line-height: 1.7; }
      a { display: inline-block; margin-top: 28px; padding: 12px 20px; border-radius: 8px; background: #fff; color: #00052a; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #8ab4ff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand-icon-192.png" alt="W. Apparels Ltd. logo" />
      <p>Error 404</p>
      <h1>Page not found</h1>
      <p class="copy">The requested page does not exist or may have moved. Return to the official W. Apparels Ltd. website.</p>
      <a href="/">Go to homepage</a>
    </main>
  </body>
